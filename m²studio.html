/* ============================================================
   ACTION DELEGATION
   ============================================================ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if(!el) return;
  const action = el.dataset.action;
  const user = currentUser();
  try {
    switch(action){
      case "nav": {
        const r = el.dataset.route;
        if(r === "admin") navigate("admin", { section: el.dataset.section || "overview", tab: el.dataset.tab });
        else if(r === "feature") navigate("feature", { slug: el.dataset.slug });
        else if(r === "chat") navigate("chat", { chatId: el.dataset.chatId });
        else navigate(r);
        break;
      }
      case "open-drawer":
        document.getElementById("drawer").classList.add("open");
        document.getElementById("drawerBackdrop").classList.add("open");
        break;
      case "close-drawer": closeDrawer(); break;
      case "close-modal": closeModal(); break;
      case "auth-tab": {
        const tab = el.dataset.tab;
        document.querySelectorAll(".auth-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
        document.getElementById("authForms").innerHTML = tab === "login" ? loginFormHtml() : registerFormHtml();
        break;
      }
      case "auth-forgot": openForgotPasswordModal(); break;
      case "auth-logout": {
        const u = currentUser();
        if(u) logAudit("Выход", "@" + u.username, "успешно");
        DB.session = null; saveState(); toast("Вы вышли","ok"); navigate("home"); break;
      }
      case "start-order": openOrderModal(el.dataset.service || null); break;
      case "open-order": openOrderDetail(el.dataset.id); break;
      case "orders-filter": navigate("orders", { status: el.dataset.status, q: route.params.q || "" }); break;
      case "open-profile": navigate("profile", { username: el.dataset.username }); break;
      case "edit-profile": openEditProfileModal(); break;
      case "change-password": openChangePasswordModal(); break;
      case "admin-edit-user": openUserAdminModal(el.dataset.id); break;
      case "edit-user-texts": openUserTextsModal(el.dataset.id); break;
      case "new-ticket": openTicketModal(); break;
      case "open-ticket": openTicketDetail(el.dataset.id); break;
      case "close-ticket": {
        const t = DB.tickets.find(x => x.id === el.dataset.id);
        if(t){ t.status = "closed"; pushNotification(t.userId, "support", "Обращение закрыто"); saveState(); closeModal(); toast("Закрыто","ok"); render(); }
        break;
      }
      case "leave-review": openReviewModal(null); break;
      case "developer-message": openDeveloperMessageModal(el.dataset.id); break;
      case "start-chat": {
        if(!user) break;
        const otherId = el.dataset.id;
        let chat = DB.chats.find(c => c.participants.length === 2 && c.participants.indexOf(user.id) !== -1 && c.participants.indexOf(otherId) !== -1);
        if(!chat){ chat = { id: uid("cht"), participants: [user.id, otherId], messages: [], createdAt: nowISO(), lastAt: nowISO() }; DB.chats.push(chat); saveState(); }
        closeModal(); navigate("chat", { chatId: chat.id });
        break;
      }
      case "new-chat": openNewChatModal(); break;
      case "open-chat": navigate("chat", { chatId: el.dataset.id }); break;
      case "block-order-chat": {
        const o = DB.orders.find(x => x.id === el.dataset.id);
        if(o){ o.chatBlocked = true; o.history.push({ at: nowISO(), by: user.name, text: "Чат заблокирован" }); pushNotification(o.clientId, "order", "Чат по заказу " + o.number + " заблокирован"); saveState(); closeModal(); toast("Заблокирован","ok"); render(); }
        break;
      }
      case "unblock-order-chat": {
        const o = DB.orders.find(x => x.id === el.dataset.id);
        if(o){ o.chatBlocked = false; o.history.push({ at: nowISO(), by: user.name, text: "Чат разблокирован" }); saveState(); closeModal(); toast("Разблокирован","ok"); render(); }
        break;
      }
      case "review-approve": { const r = DB.reviews.find(x => x.id === el.dataset.id); if(r){ r.status = "approved"; saveState(); render(); toast("Одобрено","ok"); } break; }
      case "review-reject": { const r = DB.reviews.find(x => x.id === el.dataset.id); if(r){ r.status = "rejected"; saveState(); render(); toast("Отклонено","ok"); } break; }
      case "toggle-notif": document.getElementById("notifPanel").classList.toggle("open"); break;

      case "notif-open": {

      case "new-partner": openPartnerModal(null); break;
      case "edit-partner": openPartnerModal(el.dataset.id); break;
      case "toggle-partner": { const p = DB.partners.find(x => x.id === el.dataset.id); if(p){ p.status = p.status === "active" ? "hidden" : "active"; saveState(); render(); } break; }
      case "delete-partner": { const idx = DB.partners.findIndex(x => x.id === el.dataset.id); if(idx >= 0){ DB.partners.splice(idx,1); saveState(); render(); } break; }
      case "open-theme-picker": openThemePicker(); break;
      case "set-theme": { DB.settings.theme = el.dataset.theme; applyTheme(); saveState(); openThemePicker(); break; }
      case "reset-data": {
        if(!hasPerm(user,"settings.manage")) break;
        openModal({ title:"Сброс данных", body:'<div class="note">Все данные будут удалены.</div>',
          footer:'<button class="btn btn-danger" data-action="reset-data-confirm">Подтвердить</button><button class="btn" data-action="close-modal">Отмена</button>' });
        break;
      }
      case "reset-data-confirm": { try { localStorage.removeItem(STORAGE_KEY); } catch(err){} DB = createDefaultState(); saveState(); closeModal(); navigate("home"); break; }
      case "export-data": { downloadJSON(DB, "m2studio-data.json"); toast("Экспорт","ok"); break; }
      case "module-run": { runModuleAction(el.dataset.module, Number(el.dataset.idx)); break; }
      case "new-bonus": navigate("admin", { section:"bonuses", tab:"create" }); break;
      case "delete-bonus": { const idx = DB.bonuses.findIndex(x => x.id === el.dataset.id); if(idx >= 0){ DB.bonuses.splice(idx,1); saveState(); render(); toast("Удалён","ok"); } break; }
      case "ai-example": {
        const ta = document.querySelector('form[data-form="ai-studio"] textarea[name="prompt"]');
        if(ta){ ta.value = el.dataset.text; ta.focus(); }
        break;
      }
      case "ai-add-placeholder": {
        const key = prompt("Плейсхолдер (например, {my_key}):");
        if(key && /^\{[a-zA-Zа-яА-Я0-9_]+\}$/.test(key)){
          if(!DB.placeholders.some(p => p.key === key)){
            DB.placeholders.push({ key, desc: "Пользовательский", scope: "global", value: "" });
            saveState(); render(); toast("Добавлен","ok");
          } else toast("Уже есть","warn");
        }
        break;
      }
      case "delete-placeholder": {
        DB.placeholders = (DB.placeholders||[]).filter(p => p.key !== el.dataset.key);
        saveState(); render(); toast("Удалён","ok");
        break;
      }
      default: break;
    }
  } catch(err){ console.error(err); toast("Ошибка: " + err.message, "err"); }
});

/* Handle order status/assignee select changes */
document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset.role === "order-status"){
    const o = DB.orders.find(x => x.id === el.dataset.id);
    if(o){ const old = o.status; o.status = el.value; o.history.push({ at: nowISO(), by: currentUser().name, text: "Статус: " + old + " → " + el.value }); pushNotification(o.clientId, "order", "Статус заказа " + o.number + ": " + el.value); saveState(); toast("Статус обновлён","ok"); render(); }
  }
  if(el.dataset.role === "order-assignee"){
    const o = DB.orders.find(x => x.id === el.dataset.id);
    if(o){ o.assigneeId = el.value || null; const a = DB.users.find(u => u.id === el.value); o.history.push({ at: nowISO(), by: currentUser().name, text: "Исполнитель: " + (a ? a.name : "снят") }); saveState(); toast("Исполнитель назначен","ok"); render(); }
  }
});

function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("drawerBackdrop").classList.remove("open");
}

let searchTimer = null;
document.addEventListener("input", e => {
  const t = e.target;
  const handlers = {
    servicesSearch: () => navigate("services", { q: t.value }),
    ordersSearch: () => navigate("orders", { q: t.value, status: route.params.status || "all" }),
    adminUsersSearch: () => navigate("admin", { section:"users", tab:"list", q: t.value }),
    adminOrdersSearch: () => navigate("admin", { section:"orders", q: t.value, status: route.params.status || "all" }),
    auditSearch: () => navigate("admin", { section:"audit", q: t.value, kind: route.params.kind || "all" })
  };
  if(handlers[t.id]){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(handlers[t.id], 320);
  }
});
document.addEventListener("click", e => {
  const panel = document.getElementById("notifPanel");
  const btn = document.getElementById("notifBtn");
  if(panel && btn && panel.classList.contains("open") && !panel.contains(e.target) && !btn.contains(e.target)){
    panel.classList.remove("open");
  }
});

/* ============================================================
   INIT
   ============================================================ */
function init(){
  loadState();
  applyTheme();
  const hash = String(location.hash || "").replace("#","");
  const allowed = ["home","services","developers","portfolio","news","reviews","partners","support","orders","bonuses","chats","admin-chats","profile","admin","apply-admin"];
  if(hash && allowed.indexOf(hash) !== -1) route = { name: hash, params: {} };
  render();
  setTimeout(() => {
    const splash = document.getElementById("splash");
    if(splash){ splash.classList.add("hide"); setTimeout(() => { if(splash.parentNode) splash.parentNode.removeChild(splash); }, 750); }
    if(!currentUser() && route.name === "home") navigate("profile");
  }, 2300);
  window.addEventListener("hashchange", () => {
    const h = String(location.hash || "").replace("#","");
    if(allowed.indexOf(h) !== -1 && h !== route.name){ route = { name: h, params: route.params }; render(); }
  });
}
document.addEventListener("DOMContentLoaded", init);
if(document.readyState === "interactive" || document.readyState === "complete") init();
</script>
