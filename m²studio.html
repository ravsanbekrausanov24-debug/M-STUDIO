<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>M² Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
:root{
  --bg:#08080a;--bg-2:#0d0d10;--panel:rgba(255,255,255,.035);--panel-2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.085);--border-strong:rgba(255,255,255,.16);
  --text:#ececed;--muted:#8b8b95;--muted-2:#64646e;--silver:#d6d6e0;
  --glow:rgba(126,120,255,.45);--accent:#9d96ff;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;
  --radius:18px;--radius-sm:12px;--font:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Manrope',system-ui,sans-serif;
  --glow-1:rgba(124,116,255,.16);--glow-2:rgba(200,200,230,.07);--glow-3:rgba(92,92,150,.13);
  --modal-bg:linear-gradient(175deg,#131318,#0c0c10);--drawer-bg:linear-gradient(180deg,#101014,#0a0a0d);
  --topbar-bg:rgba(10,10,13,.66);--bottomnav-bg:rgba(12,12,16,.88);--toast-bg:rgba(20,20,26,.96);
}
[data-theme="light"]{--bg:#f4f4f8;--bg-2:#ffffff;--panel:rgba(0,0,0,.04);--panel-2:rgba(0,0,0,.07);--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.18);--text:#141418;--muted:#5c5c68;--muted-2:#8b8b95;--silver:#2a2a34;--glow:rgba(80,70,220,.35);--accent:#6b5fff;--glow-1:rgba(107,95,255,.1);--glow-2:rgba(80,80,120,.06);--glow-3:rgba(100,100,160,.08);--modal-bg:linear-gradient(175deg,#ffffff,#f6f6fa);--drawer-bg:linear-gradient(180deg,#ffffff,#f4f4f8);--topbar-bg:rgba(255,255,255,.9);--bottomnav-bg:rgba(255,255,255,.92);--toast-bg:rgba(255,255,255,.98);}
[data-theme="graphite"]{--bg:#16161a;--bg-2:#1c1c22;--panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.08);--border:rgba(255,255,255,.1);--border-strong:rgba(255,255,255,.18);--text:#e6e6ea;--muted:#9a9aa4;--muted-2:#70707a;--silver:#cfcfd8;--glow:rgba(200,200,220,.3);--accent:#b8b8ff;}
[data-theme="amethyst"]{--bg:#0c0713;--bg-2:#130a1e;--panel:rgba(180,130,255,.06);--panel-2:rgba(180,130,255,.1);--border:rgba(180,130,255,.15);--border-strong:rgba(180,130,255,.28);--text:#f0e8ff;--muted:#a890c0;--muted-2:#7a6890;--silver:#e0d0f5;--glow:rgba(180,130,255,.5);--accent:#b78aff;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;line-height:1.5;font-size:15px}
body::before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(900px 520px at 12% -8%,var(--glow-1),transparent 62%),radial-gradient(760px 520px at 104% -4%,var(--glow-2),transparent 60%),radial-gradient(680px 620px at 50% 118%,var(--glow-3),transparent 62%),var(--bg)}
img{max-width:100%;display:block}
button,input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-.02em;margin:0}
p{margin:0}
.muted{color:var(--muted)}.tiny{font-size:12px}.small{font-size:13px}
.shell{max-width:1180px;margin:0 auto;padding:0 16px;width:100%}
.page{padding:26px 0 120px;animation:fadeUp .45s cubic-bezier(.22,.8,.3,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash-inner{text-align:center;padding:0 24px;display:flex;flex-direction:column;align-items:center}
.splash-logo-svg{width:clamp(180px,45vw,260px);height:auto;animation:splashLogo 1.2s cubic-bezier(.22,.8,.3,1) both;filter:drop-shadow(0 20px 50px rgba(200,200,230,.35))}
.splash-brand{font-family:var(--display);font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--muted);margin-top:8px;animation:splashFade .9s ease-out .35s both}
.splash-text{margin-top:26px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2);animation:splashFade .9s ease-out .75s both}
.splash-bar{width:120px;height:2px;margin:22px auto 0;background:var(--border);border-radius:2px;overflow:hidden;animation:splashFade .9s ease-out .9s both}
.splash-bar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,#9d96ff,transparent);animation:splashBar 1.4s ease-in-out infinite}
@keyframes splashLogo{0%{opacity:0;transform:scale(.6) translateY(20px);filter:blur(22px)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes splashFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes splashBar{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
.topbar{position:sticky;top:0;z-index:60;backdrop-filter:blur(22px) saturate(140%);background:var(--topbar-bg);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:0 16px;height:62px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;border:0;background:none;padding:0;color:inherit}
.brand-mark{width:38px;height:38px;display:grid;place-items:center;flex:none}.brand-mark svg{width:100%;height:100%}
.brand-name{font-family:var(--display);font-weight:600;font-size:16px;white-space:nowrap}.brand-name span{color:var(--muted)}
.nav-desktop{display:flex;gap:2px;margin-left:14px;flex:1;min-width:0;overflow:hidden}
.nav-link{border:0;background:none;color:var(--muted);padding:8px 11px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.18s}
.nav-link:hover{color:var(--text);background:rgba(255,255,255,.05)}.nav-link.active{color:var(--text);background:rgba(255,255,255,.08)}
.topbar-actions{display:flex;align-items:center;gap:7px;margin-left:auto;flex:none}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.18s;position:relative;flex:none}
.icon-btn:hover{background:var(--panel-2);border-color:var(--border-strong)}
.dot-badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:linear-gradient(135deg,#a89fff,#7b71ff);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}
.only-mobile{display:none}
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:98;opacity:0;pointer-events:none;transition:.25s}
.drawer-backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(320px,86vw);z-index:99;background:var(--drawer-bg);border-left:1px solid var(--border);transform:translateX(102%);transition:transform .3s cubic-bezier(.22,.8,.3,1);display:flex;flex-direction:column;padding:16px;overflow-y:auto}
.drawer.open{transform:none}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.drawer-nav{display:flex;flex-direction:column;gap:3px}
.drawer-link{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;text-align:left;width:100%;transition:.16s}
.drawer-link:hover{background:rgba(255,255,255,.05);color:var(--text)}.drawer-link.active{background:rgba(255,255,255,.08);color:var(--text)}
.drawer-sep{height:1px;background:var(--border);margin:12px 4px}
.drawer-badge{margin-left:auto;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:rgba(251,191,36,.15);color:#fbdc92;border:1px solid rgba(251,191,36,.3)}
.bottomnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--bottomnav-bg);backdrop-filter:blur(22px) saturate(140%);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottomnav-inner{display:flex;justify-content:space-around;align-items:stretch;max-width:560px;margin:0 auto}
.bn-item{flex:1;border:0;background:none;color:var(--muted-2);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;cursor:pointer;transition:.16s;font-size:10.5px;font-weight:700;position:relative;overflow:hidden}
.bn-item.active{color:var(--text)}.bn-item.active svg{filter:drop-shadow(0 0 8px var(--glow))}
.bn-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;width:100%;text-align:center}
.bn-badge{position:absolute;top:2px;right:50%;transform:translateX(10px);background:#9d96ff;color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;min-width:14px;text-align:center}
.card{background:linear-gradient(170deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid var(--border);border-radius:var(--radius);padding:18px;position:relative;transition:border-color .2s,transform .2s}
.card.hoverable:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.card-flat{background:rgba(255,255,255,.028);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.section-title{font-size:22px;line-height:1.2}.section-sub{color:var(--muted);font-size:13.5px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 17px;border-radius:12px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-weight:700;font-size:13.5px;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.btn:hover{background:var(--panel-2);border-color:var(--border-strong)}
.btn-primary{background:linear-gradient(150deg,#f2f2f7,#c9c9d6 55%,#9a9aab);color:#0a0a0d;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
[data-theme="light"] .btn-primary{background:linear-gradient(150deg,#2a2a3a,#141418);color:#fff}
.btn-accent{background:linear-gradient(150deg,rgba(157,150,255,.9),rgba(110,100,240,.85));color:#fff;border-color:transparent}
.btn-danger{color:#ffb4b4;border-color:rgba(248,113,113,.28);background:rgba(248,113,113,.1)}
.btn-ok{color:#b6f5cd;border-color:rgba(74,222,128,.28);background:rgba(74,222,128,.1)}
.btn-sm{padding:7px 11px;font-size:12.5px;border-radius:10px;gap:6px}
.btn-xs{padding:5px 9px;font-size:11.5px;border-radius:8px;gap:5px}
.btn-block{width:100%}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.btn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.btn-action{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:11px 13px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text);font-weight:600;font-size:12.5px;cursor:pointer;text-align:left;transition:.15s;width:100%;font-family:inherit;min-width:0}
.btn-action span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-action:hover{background:rgba(255,255,255,.07);border-color:var(--border-strong);transform:translateY(-1px)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.input,textarea.input,select.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:rgba(0,0,0,.32);color:var(--text);font-size:14px;outline:none;transition:.16s;font-family:inherit}
[data-theme="light"] .input,[data-theme="light"] textarea.input,[data-theme="light"] select.input{background:#fafafd;color:#222}
.input:focus{border-color:rgba(157,150,255,.55);box-shadow:0 0 0 3px rgba(157,150,255,.12)}
textarea.input{resize:vertical;min-height:92px;line-height:1.55}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%238b8b95' stroke-width='2' stroke-linecap='round'><path d='M4 6l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
select.input option{background:#121216;color:var(--text)}
.form-error{color:#ffb0b0;font-size:12.5px;margin-top:-4px;margin-bottom:10px;display:none}
.form-error.show{display:block}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.02);cursor:pointer;font-size:13px;font-weight:600}
.checkline input{accent-color:#9d96ff;width:16px;height:16px;cursor:pointer}
.checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;max-height:280px;overflow-y:auto;padding:2px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--silver)}
.badge-ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.28);color:#a6f0c0}
.badge-warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.28);color:#fbdc92}
.badge-err{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.28);color:#ffb4b4}
.badge-info{background:rgba(157,150,255,.14);border-color:rgba(157,150,255,.3);color:#c3bdff}
.badge-mute{background:rgba(255,255,255,.04);color:var(--muted)}
.badge-verified{background:linear-gradient(135deg,rgba(157,150,255,.25),rgba(74,222,128,.15));border-color:rgba(157,150,255,.4);color:#c3bdff}
.tag-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;border:1px solid var(--border)}
.hero{position:relative;padding:46px 0 34px;overflow:hidden}
.hero-glow{position:absolute;width:520px;height:520px;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,var(--glow),transparent 70%);top:-220px;right:-160px;pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.04);font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.hero-eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);display:block}
.hero-title{font-family:var(--display);font-size:clamp(36px,9vw,72px);line-height:.98;letter-spacing:-.045em;font-weight:700;margin:0 0 18px;background:linear-gradient(175deg,#ffffff 8%,#d6d6e2 42%,#7d7d8f 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme="light"] .hero-title{background:linear-gradient(175deg,#181820,#4a4a5a);-webkit-background-clip:text;color:transparent}
.hero-title small{display:block;font-size:.32em;letter-spacing:-.01em;font-weight:600;color:var(--muted);-webkit-text-fill-color:var(--muted);margin-top:14px;line-height:1.4}
.hero-text{color:var(--muted);font-size:15.5px;max-width:560px;line-height:1.65}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.service-card{display:flex;flex-direction:column;gap:13px;min-height:100%}
.service-icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid var(--border-strong);color:var(--silver)}
.service-name{font-family:var(--display);font-size:17px;font-weight:600}
.service-desc{color:var(--muted);font-size:13px;line-height:1.55;flex:1}
.service-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:2px}
.price{font-family:var(--display);font-size:19px;font-weight:700;background:linear-gradient(160deg,#fff,#b9b9c8);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
[data-theme="light"] .price{background:linear-gradient(160deg,#222,#444);-webkit-background-clip:text;color:transparent}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
.stat-card{padding:14px;border-radius:14px;border:1px solid var(--border);background:linear-gradient(165deg,rgba(255,255,255,.055),rgba(255,255,255,.015));min-width:0}
.stat-value{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;word-break:break-word;overflow-wrap:break-word}
.stat-label{font-size:11.5px;color:var(--muted);margin-top:5px;font-weight:600}
.empty{text-align:center;padding:48px 22px;border-radius:var(--radius);border:1px dashed rgba(255,255,255,.13);background:rgba(255,255,255,.015)}
.empty-icon{width:52px;height:52px;border-radius:15px;margin:0 auto 14px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted)}
.empty-title{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:6px}
.empty-text{color:var(--muted);font-size:13.5px;max-width:420px;margin:0 auto;line-height:1.6}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;border:1px solid var(--border);background:rgba(255,255,255,.026);transition:.16s}
.row:hover{background:rgba(255,255,255,.045);border-color:var(--border-strong)}
.row-main{flex:1;min-width:0}.row-title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-family:var(--display);font-weight:700;font-size:15px;color:#0b0b0e;background:linear-gradient(150deg,#ececf4,#a9a9bb 55%,#6f6f80);position:relative;overflow:hidden}
.avatar-lg{width:78px;height:78px;border-radius:24px;font-size:26px}
.avatar-sm{width:36px;height:36px;border-radius:11px;font-size:13px}
.avatar-verified::after{content:'';position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;background:#4ade80;border:2px solid var(--bg);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2.5 6l2.5 2.5L9.5 4' stroke='white' stroke-width='1.7' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-size:10px;background-repeat:no-repeat;background-position:center}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px;align-items:center}
.search-wrap{position:relative;flex:1;min-width:190px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
.search-wrap .input{padding-left:37px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:15px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--muted);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap;transition:.16s;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:rgba(255,255,255,.06)}
.tab.active{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--border-strong)}
.admin-layout{display:grid;grid-template-columns:236px 1fr;gap:20px;align-items:start}
.admin-side{position:sticky;top:78px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:4px}
.admin-side-link{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;border:0;background:none;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;text-align:left;width:100%;transition:.15s}

function hashPassword(password){
  const s = PASSWORD_SALT + "|" + String(password);
  let h1 = 0x811c9dc5, h2 = 0x01000193, h3 = 0x9e3779b9;
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    h1 ^= c; h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ c, 2654435761) >>> 0;
    h3 = (Math.imul(h3 + c, 1597334677)) >>> 0;
  }
  return [h1,h2,h3].map(n => (n >>> 0).toString(16).padStart(8,"0")).join("");
}
function uid(p){ return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){
  if(s === null || s === undefined) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtDate(iso, withTime){
  if(!iso) return "—";
  const d = new Date(iso); if(isNaN(d.getTime())) return "—";
  const date = d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric"});
  return withTime === false ? date : date + " " + d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
}
function parseDateInputLocal(str){
  if(!str) return null;
  const m = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){ const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), 12, 0, 0); return isNaN(d.getTime()) ? null : d.toISOString(); }
  const d = new Date(str); return isNaN(d.getTime()) ? null : d.toISOString();
}
function fmtDeadline(iso){
  if(!iso) return "—";
  const d = new Date(iso); if(isNaN(d.getTime())) return "—";
  return d.toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit", year:"numeric"});
}
function relTime(iso){
  const d = new Date(iso); if(isNaN(d.getTime())) return "—";
  const diff = Date.now() - d.getTime();
  const min = Math.floor(diff / 60000);
  if(min < 1) return "только что";
  if(min < 60) return min + " мин назад";
  const hrs = Math.floor(min / 60);
  if(hrs < 24) return hrs + " ч назад";
  const days = Math.floor(hrs / 24);
  if(days < 7) return days + " дн назад";
  return fmtDate(iso, false);
}
function initials(name){
  const parts = String(name || "?").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}
function stars(n){ return Number(n) + " ⭐"; }
function toast(message, type){
  const root = document.getElementById("toasts");
  if(!root) return;
  const el = document.createElement("div");
  el.className = "toast " + (type || "");
  el.innerHTML = ic({ok:"check",err:"alert",warn:"alert"}[type] || "bell", 16) + "<span>" + escapeHtml(message) + "</span>";
  root.appendChild(el);
  setTimeout(()=>{
    el.style.transition = "opacity .25s, transform .25s";
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(()=>el.remove(), 260);
  }, 3200);
}

function resolvePlaceholders(text, user){
  if(!text) return "";
  if(!user) user = currentUser();
  const map = {
    "{name}": user ? user.name : "Гость",
    "{username}": user ? user.username : "guest",
    "{role}": user ? (ROLE_LABELS[user.role] || user.role) : "Гость",
    "{balance}": String(user && user.balance ? user.balance : 0),
    "{date}": new Date().toLocaleDateString("ru-RU"),
    "{time}": new Date().toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"}),
    "{studio_name}": DB.settings.siteName,
    "{orders_count}": user ? String(DB.orders.filter(o => o.clientId === user.id).length) : "0",
    "{projects_count}": user ? String(DB.projects.filter(p => p.authorId === user.id && p.status === "published").length) : "0",
    "{verification}": user && user.verification ? user.verification.text : "",
    "{status}": user ? (ACCOUNT_STATUSES.find(s => s.key === (user.accountStatus || "active")) || {label:"—"}).label : "—",
    "{last_order}": user ? (DB.orders.filter(o => o.clientId === user.id).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0]?.number || "—") : "—",
    "{tag_list}": user ? (user.tags||[]).map(id => DB.tags.find(t=>t.id===id)?.label).filter(Boolean).join(", ") : "",
    "{bonuses_count}": user ? String(DB.userBonuses.filter(b => b.userId === user.id && b.status === "active").length) : "0"
  };
  // Dynamic user-defined placeholders stored in DB.placeholders (k => value or user-bound)
  (DB.placeholders || []).forEach(ph => {
    if(ph.scope === "global") map[ph.key] = ph.value || "";
  });
  if(user && user.dynamicPlaceholders){
    Object.keys(user.dynamicPlaceholders).forEach(k => { map[k] = user.dynamicPlaceholders[k]; });
  }
  let result = String(text);
  Object.keys(map).forEach(key => { result = result.split(key).join(map[key]); });
  return result;
}

function isValidState(o){ return o && typeof o === "object" && Array.isArray(o.services) && Array.isArray(o.users) && Array.isArray(o.orders); }

function loadState(){
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch(e){ DB = createDefaultState(); return; }
  if(!raw){ DB = createDefaultState(); saveState(); return; }
  try {
    const parsed = JSON.parse(raw);
    if(!isValidState(parsed)) throw new Error("bad structure");
    const base = createDefaultState();
    DB = Object.assign(base, parsed);
    DB.settings = Object.assign(base.settings, parsed.settings || {});
    DB.texts = Object.assign(base.texts, parsed.texts || {});
    DB.roles = Object.assign(JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMISSIONS)), parsed.roles || {});
    ["services","tags","users","orders","projects","news","reviews","partners","tickets","notifications","audit","invites","resetRequests","developers","features","chats","adminApplications","bonuses","userBonuses","placeholders","aiHistory","campaigns","banners","promocodes","integrations","apiKeys","webhooks","backups","moduleLogs"].forEach(k => {
      if(!Array.isArray(DB[k])) DB[k] = base[k];
    });
    DB.users.forEach(u => {
      if(!u.accountStatus) u.accountStatus = u.status || "active";
      if(typeof u.balance !== "number") u.balance = 0;
      if(!u.customTexts) u.customTexts = {};
      if(!u.dynamicPlaceholders) u.dynamicPlaceholders = {};
    });
    if(DB.session && !DB.users.some(u => u.id === DB.session.userId)) DB.session = null;
  } catch(e){
    console.warn("Corrupted, reset:", e);
    DB = createDefaultState();
    saveState();
  }
  ensureSystemAccounts();
}

/* ============================================================
   USERS & PERMISSIONS
   ============================================================ */
function currentUser(){ return DB && DB.session ? (DB.users.find(u => u.id === DB.session.userId) || null) : null; }
function findUserByUsername(u){ return DB.users.find(x => x.username.toLowerCase() === String(u || "").replace(/^@/,"").toLowerCase()) || null; }
function rolePermissions(r){
  if(r === "OWNER" || r === "SYSTEM") return ["*"];
  const l = DB.roles[r]; return Array.isArray(l) ? l : [];
}
function permsOf(u){
  if(!u) return [];
  if(u.role === "OWNER" || u.role === "SYSTEM") return ["*"];
  if(Array.isArray(u.permissionOverride)) return u.permissionOverride;
  return rolePermissions(u.role);
}
function hasPerm(u, p){
  if(!u) return false;
  const l = permsOf(u);
  return l.indexOf("*") !== -1 || l.indexOf(p) !== -1;
}
function isStaff(u){ return !!u && u.role !== "CLIENT" && u.role !== "SYSTEM"; }
function canManageSpecs(u){ return !!u && ["OWNER","DEPUTY_OWNER","TECHNICAL_DIRECTOR","DEPUTY_TECHNICAL_DIRECTOR"].indexOf(u.role) !== -1; }
function isBlocked(u){ return !!u && (u.status === "suspended" || u.status === "removed" || u.accountStatus === "scammer"); }

/* ============================================================
   NOTIFICATIONS & AUDIT
   ============================================================ */
function pushNotification(userId, type, text){
  if(!userId) return;
  DB.notifications.unshift({ id: uid("ntf"), userId, type: type||"system", text, read: false, at: nowISO() });
  if(DB.notifications.length > MAX_NOTIFICATIONS) DB.notifications.length = MAX_NOTIFICATIONS;
  saveState();
}
function notifyStaff(perm, type, text, exclude){
  DB.users.forEach(u => {
    if(u.id === exclude) return;
    if(hasPerm(u, perm)) DB.notifications.unshift({ id: uid("ntf"), userId: u.id, type, text, read: false, at: nowISO() });
  });
  if(DB.notifications.length > MAX_NOTIFICATIONS) DB.notifications.length = MAX_NOTIFICATIONS;
}
function logAudit(action, target, result, reason){
  const actor = currentUser();
  DB.audit.unshift({
    id: uid("aud"), actorId: actor ? actor.id : null, actorName: actor ? actor.username : "гость",
    action, target: target || "—", result: result || "успешно", reason: reason || "", at: nowISO()
  });
  if(DB.audit.length > MAX_AUDIT) DB.audit.length = MAX_AUDIT;
}

function render(){
  renderTopbar();
  renderDrawer();
  renderBottomNav();
  renderNotifButton();

  const app = document.getElementById("app");
  let html = "";
  switch(route.name){
    case "home": html = viewHome(); break;
    case "services": html = viewServices(); break;
    case "developers": html = viewDevelopers(); break;
    case "portfolio": html = viewPortfolio(); break;
    case "news": html = viewNews(); break;
    case "reviews": html = viewReviews(); break;
    case "partners": html = viewPartners(); break;
    case "support": html = viewSupport(); break;
    case "orders": html = viewOrders(); break;
    case "bonuses": html = viewBonuses(); break;
    case "chats": html = viewChats(false); break;
    case "admin-chats": html = viewChats(true); break;
    case "chat": html = viewChat(route.params.chatId); break;
    case "apply-admin": html = viewApplyAdmin(); break;
    case "profile": html = viewProfile(route.params.username || null); break;
    case "feature": html = viewFeature(route.params.slug); break;
    case "admin": html = viewAdmin(route.params.section || "overview", route.params.tab); break;
    default: html = viewHome();

  app.innerHTML = '<div class="page">' + html + '</div>';

    '<button class="nav-link' + (route.name === item.route ? " active" : "") + '" data-action="nav" data-route="' + item.route + '">' + escapeHtml(item.label) + '</button>'

    '<button class="nav-link" data-action="nav" data-route="feature" data-slug="' + escapeHtml(f.slug) + '">' + escapeHtml(f.title) + '</button>'

function renderBottomNav(){
  const nav = document.getElementById("bottomNav");
  const user = currentUser();
  let items = getBottomItems(user);
  const bottomFeatures = activeFeatures().filter(f => f.location === "bottom");
  bottomFeatures.forEach(f => {
    if(items.length < 6 && !items.some(i => i.route === "feature" && i.slug === f.slug)){
      items.push({ route:"feature", slug: f.slug, label: f.title, icon: f.icon || "layers" });
    }
  });
  nav.innerHTML = items.map(item => {
    const active = route.name === item.route && (!item.slug || route.params.slug === item.slug);
    let unread = 0;
    if(item.route === "chats" && user){
      unread = DB.chats.filter(c => c.participants.indexOf(user.id) !== -1 && c.messages.some(m => m.authorId !== user.id && !m.read)).length;
    } else if(item.route === "admin-chats" && user){
       unread = DB.chats.filter(c => c.participants.indexOf("system") === -1 && c.participants.indexOf(user.id) !== -1 && c.messages.some(m => m.authorId !== user.id && !m.read)).length;
    }
    return '<button class="bn-item' + (active ? " active" : "") + '" data-action="nav" data-route="' + item.route + '"' +
      (item.slug ? ' data-slug="' + escapeHtml(item.slug) + '"' : '') + '>' +
      ic(item.icon,20) + '<span>' + escapeHtml(item.label) + '</span>' +
      (unread ? '<span class="bn-badge">' + unread + '</span>' : '') + '</button>';
  }).join("");
}

function viewChats(isAdminView){
  const user = currentUser();
  if(!user) return emptyState("message","Требуется вход","Войдите, чтобы видеть чаты.") +
    '<div style="margin-top:16px"><button class="btn btn-primary" data-action="nav" data-route="profile">Войти</button></div>';
  
  let myChats = DB.chats.filter(c => c.participants.indexOf(user.id) !== -1);
  if(isAdminView){ myChats = myChats.filter(c => c.participants.indexOf("system") === -1); }
  else { myChats = myChats.filter(c => c.participants.indexOf("system") !== -1 || c.participants.indexOf(user.id) !== -1); }
  myChats.sort((a,b) => {
    const aL = a.messages.length ? new Date(a.messages[a.messages.length-1].at) : new Date(a.createdAt);
    const bL = b.messages.length ? new Date(b.messages[b.messages.length-1].at) : new Date(b.createdAt);
    return bL - aL;
  });

  return '<div class="section-head"><div><h2 class="section-title">' + (isAdminView ? 'Чаты с пользователями' : 'Чаты') + '</h2>' +
    '<div class="section-sub">' + (isAdminView ? 'Все обращения и заказы.' : 'Личные переписки.') + '</div></div>' +
    (isStaff(user) ? '<button class="btn btn-sm btn-primary" data-action="new-chat">' + ic("plus",14) + 'Новый чат</button>' : '') + '</div>' +
    (myChats.length ? '<div class="chat-list">' + myChats.map(c => chatItemHtml(c, user)).join("") + '</div>'
      : emptyState("message","Чатов пока нет", isStaff(user) ? "Начните чат с пользователем." : "Создайте заказ или напишите разработчику."));
}
function chatItemHtml(c, viewer){
  let other;
  if(c.participants.indexOf("system") !== -1 && c.participants.indexOf(viewer.id) !== -1){
    other = DB.users.find(u => u.id === "system");
  } else {
    const otherId = c.participants.find(p => p !== viewer.id);
    other = DB.users.find(u => u.id === otherId);
  }
  if(!other) return '';
  const last = c.messages.length ? c.messages[c.messages.length-1] : null;
  const unread = c.messages.filter(m => m.authorId !== viewer.id && !m.read).length;
  const verified = !!other.verification;
  return '<div class="chat-item" data-action="open-chat" data-id="' + c.id + '">' +
    '<div class="avatar avatar-sm' + (verified ? ' avatar-verified' : '') + '">' + escapeHtml(initials(other.name)) + '</div>' +
    '<div class="chat-item-main"><div class="chat-item-title">' + escapeHtml(other.name) + (verified ? ' ✓' : '') + '</div>' +
      '<div class="chat-item-preview">' + (last ? escapeHtml((last.authorId === viewer.id ? "Вы: " : "") + last.text) : "Нет сообщений") + '</div></div>' +
    '<div class="chat-item-meta"><div class="chat-item-time">' + (last ? relTime(last.at) : '') + '</div>' +
      (unread ? '<span class="chat-unread">' + unread + '</span>' : '') + '</div></div>';
}

function viewChat(chatId){
  const user = currentUser();
  if(!user) return emptyState("lock","Требуется вход","");
  const c = DB.chats.find(x => x.id === chatId);
  if(!c) return emptyState("message","Чат не найден","");
  if(c.participants.indexOf(user.id) === -1) return emptyState("shield","Нет доступа","");
  let other;
  if(c.participants.indexOf("system") !== -1){ other = DB.users.find(u => u.id === "system"); }
  else { const otherId = c.participants.find(p => p !== user.id); other = DB.users.find(u => u.id === otherId); }
  if(!other) return emptyState("user","Собеседник не найден","");

  let changed = false;
  c.messages.forEach(m => { if(m.authorId !== user.id && !m.read){ m.read = true; changed = true; } });
  if(changed) saveState();

  return '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">' +

function viewOrders(){
  const user = currentUser();
  if(!user) return emptyState("lock","Требуется вход","") +
    '<div style="margin-top:16px"><button class="btn btn-primary" data-action="nav" data-route="profile">Войти</button></div>';
  const canSeeAll = hasPerm(user, "orders.view_all");
  let list = DB.orders.filter(o => canSeeAll ? true : o.clientId === user.id);
  const q = (route.params.q || "").toLowerCase();
  const st = route.params.status || "all";
  if(q) list = list.filter(o => (o.number + " " + o.title + " " + o.description + " " + o.category).toLowerCase().includes(q));
  if(st !== "all") list = list.filter(o => o.status === st);
  list.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));

  return '<div class="section-head"><div><h2 class="section-title">Заказы</h2></div>' +
    '<button class="btn btn-sm btn-accent" data-action="start-order">' + ic("plus",14) + 'Новый заказ</button></div>' +
    '<div class="toolbar"><div class="search-wrap">' + ic("search",16) +
      '<input class="input" id="ordersSearch" placeholder="Поиск" value="' + escapeHtml(route.params.q || "") + '"></div></div>' +
    '<div class="tabs">' +
      '<button class="tab' + (st === "all" ? " active" : "") + '" data-action="orders-filter" data-status="all">Все</button>' +
      ORDER_STATUSES.map(s => '<button class="tab' + (st === s ? " active" : "") + '" data-action="orders-filter" data-status="' + escapeHtml(s) + '">' + escapeHtml(s) + '</button>').join("") + '</div>' +
    (list.length ? '<div style="display:flex;flex-direction:column;gap:9px">' + list.map(orderRowHtml).join("") + '</div>'
      : emptyState("receipt","Заказов нет","Оформите первый заказ."));
}
function orderRowHtml(o){
  const tone = STATUS_TONE[o.status] || "mute";
  const assignee = DB.users.find(u => u.id === o.assigneeId);
  const client = DB.users.find(u => u.id === o.clientId);
  return '<div class="row" data-action="open-order" data-id="' + escapeHtml(o.id) + '" style="cursor:pointer">' +
    '<div style="flex:none"><span class="badge badge-' + tone + '">' + escapeHtml(o.status) + '</span></div>' +
    '<div class="row-main"><div class="row-title">' + escapeHtml(o.title) + '</div>' +
      '<div class="row-sub">' + escapeHtml(o.number) + ' · ' + escapeHtml(o.category) + ' · ' + stars(o.price) +
        (o.deadline ? ' · до ' + fmtDeadline(o.deadline) : '') +
        (client ? ' · ' + escapeHtml(client.name) : '') +
        (assignee ? ' · ' + escapeHtml(assignee.name) : ' · без исполнителя') +
        (o.chatBlocked ? ' · 🔒' : '') + '</div></div>' +
    '<div class="row-actions"><span class="tiny muted">' + fmtDate(o.createdAt, false) + '</span>' + ic("chevronRight",16) + '</div></div>';
}

function viewFeature(slug){
  const f = DB.features.find(x => x.slug === slug);
  const user = currentUser();
  if(!f) return emptyState("wand","Раздел не найден","");
  const isWip = f.status === "wip";
  const canEdit = user && hasPerm(user, "features.manage");
  const content = f.content && f.content.trim()
    ? '<div class="card"><div style="white-space:pre-wrap;line-height:1.7">' + escapeHtml(resolvePlaceholders(f.content, user)) + '</div></div>'
    : '<div class="card"><p class="muted">Содержимое пока не задано.</p></div>';

  return '<div class="section-head"><div><h2 class="section-title">' + ic(f.icon || "layers",22) + ' ' + escapeHtml(f.title) + '</h2>' +
      '<div class="section-sub">' + (isWip ? 'Раздел в разработке' : 'Раздел активен') + '</div></div>' +
    (canEdit ? '<button class="btn btn-sm" data-action="edit-feature" data-id="' + f.id + '">' + ic("edit",14) + ' Изменить</button>' : '') + '</div>' +
    (isWip
      ? '<div class="card" style="text-align:center;padding:44px 22px">' +
          '<div class="empty-icon" style="margin:0 auto 16px">' + ic("wand",24) + '</div>' +
          '<div class="empty-title" style="font-size:20px">' + escapeHtml(f.title) + ' — в разработке</div>' +
          '<div class="empty-text" style="margin-top:8px">Раздел скоро станет доступен.</div></div>'
      : content);
}

function viewAdmin(section, tab){
  const user = currentUser();
  if(!user) return emptyState("lock","Требуется вход","") +
    '<div style="margin-top:16px"><button class="btn btn-primary" data-action="nav" data-route="profile">Войти</button></div>';
  if(!isStaff(user)) return emptyState("shield","Доступ закрыт","");
  const available = ADMIN_SECTIONS.filter(s => !s.perm || hasPerm(user, s.perm));
  if(!available.length) return emptyState("shield","Нет доступных разделов","");
  if(!available.some(s => s.key === section)) section = available[0].key;
  tab = tab || "main";

  const side = available.map(s =>
    '<button class="admin-side-link' + (s.key === section ? " active" : "") + '" data-action="admin-section" data-section="' + s.key + '">' +
      ic(s.icon,16) + '<span>' + escapeHtml(s.label) + '</span></button>'
  ).join("");

  let body = "";
  switch(section){
    case "overview": body = adminOverview(user); break;
    case "stats": body = adminStats(user); break;
    case "orders": body = adminOrders(user); break;
    case "users": body = adminUsers(user, tab); break;
    case "team": body = adminTeam(user, tab); break;
    case "developers": body = adminDevelopers(user, tab); break;
    case "applications": body = adminApplications(user, tab); break;
    case "verification": body = adminVerification(user, tab); break;
    case "roles": body = adminRoles(user); break;
    case "tags": body = adminTags(user); break;
    case "services": body = adminServices(user, tab); break;
    case "texts": body = adminTexts(user, tab); break;
    case "features": body = adminFeatures(user, tab); break;
    case "news": body = adminNews(user, tab); break;
    case "portfolio": body = adminPortfolio(user, tab); break;
    case "reviews": body = adminReviews(user, tab); break;
    case "partners": body = adminPartners(user, tab); break;
    case "support": body = adminSupport(user); break;
    case "bonuses": body = adminBonuses(user, tab); break;
    case "ai": body = adminAI(user, tab); break;
    case "marketing": body = renderModule(user, "marketing"); break;
    case "analytics": body = renderModule(user, "analytics"); break;
    case "moderation": body = renderModule(user, "moderation"); break;
    case "devtools": body = renderModule(user, "devtools"); break;
    case "database": body = renderModule(user, "database"); break;
    case "api": body = renderModule(user, "api"); break;
    case "logs": body = renderModule(user, "logs"); break;
    case "backups": body = renderModule(user, "backups"); break;
    case "integrations": body = renderModule(user, "integrations"); break;
    case "system": body = renderModule(user, "system"); break;
    case "audit": body = adminAudit(user); break;
    case "settings": body = adminSettings(user); break;
    default: body = adminOverview(user);
  }
  return '<div class="admin-layout"><aside class="admin-side">' + side + '</aside><div class="admin-panel">' + body + '</div></div>';
}

function renderModule(user, key){
  const mod = MODULE_DEFS[key];
  if(!mod) return emptyState("alert","Модуль не найден","");
  return '<div class="admin-title">' + mod.title + '</div>' +
    '<div class="admin-desc">' + mod.desc + ' · ' + mod.actions.length + ' функций</div>' +
    '<div class="btn-grid">' + mod.actions.map((a, i) =>
      '<button class="btn-action" data-action="module-run" data-module="' + key + '" data-idx="' + i + '">' +
        ic(a.i || "play", 15) + '<span>' + escapeHtml(a.l) + '</span></button>'
    ).join("") + '</div>';
}

/* MODULE ACTION HANDLERS */
function runModuleAction(moduleKey, idx){
  const mod = MODULE_DEFS[moduleKey];
  if(!mod || !mod.actions[idx]) return toast("Функция не найдена","err");
  const action = mod.actions[idx];
  const act = action.a;
  const user = currentUser();
  
  // Log module activity
  DB.moduleLogs = DB.moduleLogs || [];
  DB.moduleLogs.unshift({ id: uid("mlg"), module: moduleKey, action: act, label: action.l, by: user.username, at: nowISO() });
  if(DB.moduleLogs.length > 500) DB.moduleLogs.length = 500;
  logAudit("Модуль: " + mod.title, action.l, "успешно");
  saveState();
  
  // ---- MARKETING ----
  if(act === "mkt-promo-create"){
    const code = "M2" + Math.random().toString(36).slice(2,8).toUpperCase();
    DB.promocodes.push({id: uid("promo"), code, active: true, uses: 0, maxUses: 100, discount: 10, createdAt: nowISO()});
    toast("Создан промокод " + code, "ok");
  } else if(act === "mkt-promo-list"){
    if(!DB.promocodes.length) return toast("Промокодов нет", "warn");
    openModal({title:"Промокоды (" + DB.promocodes.length + ")", wide:true, body:
      '<div class="code-block">' + escapeHtml(DB.promocodes.map(p => p.code + " · скидка " + p.discount + "% · использован " + p.uses + "/" + p.maxUses).join("\n")) + '</div>'});
  } else if(act === "mkt-promo-export"){
    downloadJSON(DB.promocodes, "promocodes.json");
    toast("Экспортировано " + DB.promocodes.length + " промокодов", "ok");
  } else if(act === "mkt-promo-clear"){
    DB.promocodes = []; saveState(); toast("Промокоды очищены", "ok");
  } else if(act === "mkt-promo-activate"){
    if(!DB.promocodes.length) return toast("Промокодов нет", "warn");
    DB.promocodes[0].active = !DB.promocodes[0].active;
    saveState(); toast("Промокод " + DB.promocodes[0].code + " → " + (DB.promocodes[0].active ? "активен" : "скрыт"), "ok");
  } else if(act === "mkt-banner-create"){
    const title = prompt("Название баннера:", "Баннер " + (DB.banners.length + 1));
    if(title){ DB.banners.push({id: uid("ban"), title, active: true, createdAt: nowISO()}); saveState(); toast("Баннер создан", "ok"); }
  } else if(act === "mkt-banner-list"){
    if(!DB.banners.length) return toast("Баннеров нет", "warn");
    openModal({title:"Баннеры (" + DB.banners.length + ")", body:'<div class="code-block">' + escapeHtml(DB.banners.map(b => b.title + " · " + (b.active ? "активен" : "скрыт")).join("\n")) + '</div>'});
  } else if(act === "mkt-banner-hide"){
    DB.banners.forEach(b => b.active = false); saveState(); toast("Все баннеры скрыты", "ok");
  } else if(act === "mkt-banner-clear"){
    DB.banners = []; saveState(); toast("Баннеры удалены", "ok");
  } else if(act === "mkt-campaign-create"){
    const name = prompt("Название кампании:", "Кампания " + (DB.campaigns.length + 1));
    if(name){ DB.campaigns.push({id: uid("cmp"), name, status: "active", budget: 0, createdAt: nowISO()}); saveState(); toast("Кампания создана", "ok"); }
  } else if(act === "mkt-campaign-list"){
    if(!DB.campaigns.length) return toast("Кампаний нет", "warn");
    openModal({title:"Кампании (" + DB.campaigns.length + ")", body:'<div class="code-block">' + escapeHtml(DB.campaigns.map(c => c.name + " · " + c.status + " · бюджет " + c.budget + " ⭐").join("\n")) + '</div>'});
  } else if(act === "mkt-campaign-stats"){
    openModal({title:"Статистика кампаний", body:'<div class="kv"><span class="kv-k">Всего кампаний</span><span class="kv-v">' + DB.campaigns.length + '</span></div>' +
      '<div class="kv"><span class="kv-k">Активных</span><span class="kv-v">' + DB.campaigns.filter(c => c.status === "active").length + '</span></div>' +
      '<div class="kv"><span class="kv-k">Всего бюджета</span><span class="kv-v">' + DB.campaigns.reduce((s,c) => s + (c.budget||0), 0) + ' ⭐</span></div>'});
  } else if(act === "mkt-campaign-stop"){
    DB.campaigns.forEach(c => c.status = "paused"); saveState(); toast("Все кампании остановлены", "ok");
  } else if(act === "mkt-campaign-clear"){
    DB.campaigns = []; saveState(); toast("Кампании удалены", "ok");
  } else if(act === "mkt-utm-create"){
    const utm = "utm_" + Math.random().toString(36).slice(2,7);
    DB.banners.push({id: uid("utm"), title: utm, active: true, createdAt: nowISO(), isUtm: true});
    saveState(); toast("UTM создан: " + utm, "ok");
  } else if(act === "mkt-utm-list" || act === "mkt-utm-report"){
    const utms = DB.banners.filter(b => b.isUtm);
    if(!utms.length) return toast("UTM нет", "warn");

function downloadJSON(data, filename){
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch(e){ toast("Ошибка экспорта", "err"); }
}

function importJSON(cb){
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json";
  input.onchange = (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try { cb(JSON.parse(ev.target.result)); }
      catch(err){ toast("Ошибка чтения файла", "err"); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function handleAIStudio(form){
  hideError("aiStudioError");
  const prompt = String(form.prompt.value || "").trim();
  const mode = String(form.mode.value || "auto");
  const location = String(form.location.value || "bottom");
  const position = Number(form.position.value) || 5;
  const user = currentUser();
  
  if(prompt.length < 10) return showError("aiStudioError","Опишите ТЗ подробнее (минимум 10 символов).");
  
  const p = prompt.toLowerCase();
  let result = "";
  
  // === Auto-detect mode ===
  let actualMode = mode;
  if(mode === "auto"){
    if(p.includes("плейсхолдер") || p.includes("{")) actualMode = "create-placeholder";
    else if(p.includes("вкладк") || p.includes("раздел") || p.includes("страниц")) actualMode = "create-tab";
    else if(p.includes("перепиш") || p.includes("измени") && p.includes("раздел")) actualMode = "rewrite-feature";
    else if(p.includes("текст") && (p.includes("главн") || p.includes("сайт"))) actualMode = "edit-texts";
    else actualMode = "create-tab";
  }
  
  // === Create placeholder ===
  if(actualMode === "create-placeholder"){
    const keyMatch = prompt.match(/\{([a-zA-Zа-яА-Я0-9_]+)\}/);
    if(!keyMatch) return showError("aiStudioError","Не найден плейсхолдер в формате {имя}");
    const key = "{" + keyMatch[1] + "}";
    const desc = prompt.replace(key, "").trim() || "Пользовательский плейсхолдер";
    if(!DB.placeholders) DB.placeholders = [];
    if(DB.placeholders.some(x => x.key === key)) return showError("aiStudioError","Такой плейсхолдер уже существует.");
    // Extract value from prompt if mentioned
    let val = "";
    const valMatch = prompt.match(/для\s+(.+)/i);
    if(valMatch) val = valMatch[1].slice(0, 100);
    DB.placeholders.push({ key, desc: desc.slice(0, 100), scope: "global", value: val || "" });
    result = "Создан плейсхолдер " + key + " · " + desc.slice(0, 60);
    saveState();
    toast("Плейсхолдер " + key + " создан", "ok");
  }
  // === Create tab ===
  else if(actualMode === "create-tab"){
    // Extract title
    let title = "Новый раздел";
    const patterns = [
      /(?:добавь|создай|добавить|создать)\s+(?:вкладку|раздел|страницу)\s+["«]?([^"»\n.,]+)["»]?/i,
      /(?:вкладку|раздел|страницу)\s+["«]?([^"»\n.,]+)["»]?/i,
      /(?:с\s+названием\s+|называется\s+)["«]?([^"»\n.,]+)["»]?/i
    ];
    for(const pat of patterns){
      const m = prompt.match(pat);
      if(m && m[1].length >= 2 && m[1].length < 40){ title = m[1].trim(); break; }
    }
    title = title.charAt(0).toUpperCase() + title.slice(1);
    
    // Detect position override
    let actualPosition = position;
    if(p.includes("после профиля") || p.includes("после «профиль»")) actualPosition = 5;
    if(p.includes("после заказов") || p.includes("после «заказы»")) actualPosition = 4;
    if(p.includes("первой") || p.includes("первым") || p.includes("в начало")) actualPosition = 1;
    
    // Detect location
    let actualLocation = location;
    if(p.includes("3 лини") || p.includes("три лини") || p.includes("боков")) actualLocation = "drawer";
    else if(p.includes("главн") && p.includes("меню")) actualLocation = "main";
    else if(p.includes("снизу") || p.includes("нижн")) actualLocation = "bottom";
    
    // Slug
    const slug = transliterate(title).toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_|_$/g, "").slice(0, 24) || ("tab_" + Date.now().toString(36));
    
    if(DB.features.some(f => f.slug === slug)) return showError("aiStudioError","Раздел с таким названием уже существует.");
    
    // Generate content
    const content = "Раздел «" + title + "»\n\n" +
      "Привет, {name}! Это раздел для пользователя @{username}.\n\n" +
      "Ваша роль: {role}\n" +
      "Статус: {status}\n" +
      "Баланс: {balance} ⭐\n" +
      "Дата: {date} {time}\n\n" +
      "Здесь будет отображаться информация раздела «" + title + "». Создано через AI Studio по ТЗ: «" + prompt + "»";
    
    // Choose icon
    let icon = "sparkle";
    if(p.includes("баланс") || p.includes("кошел") || p.includes("деньг")) icon = "wallet";
    else if(p.includes("информац") || p.includes("о нас")) icon = "book";
    else if(p.includes("истори")) icon = "history";
    else if(p.includes("достижен") || p.includes("награ")) icon = "star";
    else if(p.includes("бонус")) icon = "gift";
    else if(p.includes("друз") || p.includes("сообществ")) icon = "users";
    else if(p.includes("магазин") || p.includes("каталог")) icon = "cart";
    else if(p.includes("задач")) icon = "clipboard";
    else if(p.includes("настрой")) icon = "settings";
    
    const status = p.includes("в разработке") || p.includes("wip") || p.includes("черновик") ? "wip" : "active";
    
    DB.features.push({
      id: uid("feat"), slug, title, icon, location: actualLocation,
      position: actualPosition, status, content,
      authorId: user.id, createdAt: nowISO(), aiGenerated: true
    });
    result = "Создан раздел «" + title + "» в " + (actualLocation === "bottom" ? "нижней панели #" + actualPosition : actualLocation === "drawer" ? "3 линиях" : "главном меню");
    saveState();
    toast(result, "ok");
  }
  // === Rewrite feature ===
  else if(actualMode === "rewrite-feature"){
    // Find which feature
    let target = null;
    for(const f of DB.features){
      if(p.includes(f.title.toLowerCase()) || p.includes(f.slug)){
        target = f; break;
      }
    }
    if(!target) return showError("aiStudioError","Раздел не найден. Укажите название раздела из существующих: " + DB.features.map(f => f.title).join(", "));
    
    // Generate style-based content
    let tone = "обычный";
    if(p.includes("премиум") || p.includes("дорог")) tone = "премиум";
    else if(p.includes("коротк") || p.includes("минимал")) tone = "минимализм";
    else if(p.includes("подробн") || p.includes("детальн")) tone = "подробный";
    
    const contentMap = {
      "премиум": "Добро пожаловать в раздел «" + target.title + "».\n\n{name}, мы рады видеть вас снова.\n\nВаш статус: {role}\nБаланс: {balance} ⭐\nДата: {date}\n\nЭтот раздел создан специально для вас.",
      "минимализм": target.title + "\n\nПривет, {name}.\nБаланс: {balance} ⭐",
      "подробный": "Раздел «" + target.title + "»\n\n" +
        "Пользователь: {name}\n" +
        "Username: @{username}\n" +
        "Роль: {role}\n" +
        "Статус аккаунта: {status}\n" +
        "Баланс: {balance} ⭐\n" +
        "Количество заказов: {orders_count}\n" +
        "Количество проектов: {projects_count}\n" +
        "Дата: {date}\n" +
        "Время: {time}\n\n" +
        "Содержимое раздела будет дополнено."
    };
    target.content = contentMap[tone] || ("Раздел «" + target.title + "»\n\n{name}, привет!\nБаланс: {balance} ⭐\nДата: {date}");
    target.updatedAt = nowISO();
    result = "Переписан раздел «" + target.title + "» (стиль: " + tone + ")";
    saveState();
    toast(result, "ok");
  }
  // === Edit texts ===
  else if(actualMode === "edit-texts"){
    let changed = false;
    if(p.includes("главн") && p.includes("текст")){
      DB.texts.heroText = "Привет, {name}! Добро пожаловать в " + DB.settings.siteName + ". Мы создаём цифровые продукты с {date}. Ваш баланс: {balance} ⭐. Роль: {role}.";
      changed = true;
    }
    if(p.includes("как заказ") || p.includes("как работает")){
      DB.texts.howToOrderText = "1. Оставьте заявку.\n2. Мы свяжемся с вами.\n3. Обсудим детали.\n4. Выполним работу в срок.\n\nКлиент: {name}\nДата: {date}";
      changed = true;
    }
    if(!changed){
      DB.texts.heroText = resolvePlaceholders(prompt, user);
      changed = true;
    }
    result = "Тексты обновлены по ТЗ";
    saveState();
    toast(result, "ok");
  }
  // === Full site refactor ===
  else if(actualMode === "full-site"){
    // Add new feature + placeholder + update texts
    const title = "Новый раздел ИИ";
    const slug = "ai_" + Date.now().toString(36);
    DB.features.push({
      id: uid("feat"), slug, title, icon: "sparkle", location: "bottom",
      position: 5, status: "active",
      content: "Создано через полный рефакторинг ИИ.\n\nТЗ: " + prompt + "\n\n{name}, ваш баланс: {balance} ⭐.\nДата: {date}",
      authorId: user.id, createdAt: nowISO(), aiGenerated: true
    });
    DB.placeholders.push({ key: "{ai_" + Date.now().toString(36).slice(0,5) + "}", desc: "ИИ-плейсхолдер", scope: "global", value: "auto" });
    DB.texts.heroText = resolvePlaceholders("Добро пожаловать, {name}! " + prompt, user);
    result = "Полный рефакторинг выполнен: создан раздел, добавлен плейсхолдер, обновлены тексты";
    saveState();
    toast(result, "ok");
  }
  
  // Log AI action
  DB.aiHistory.unshift({
    id: uid("ai"), prompt, mode: actualMode, result,
    by: user.username, at: nowISO()
  });
  if(DB.aiHistory.length > 100) DB.aiHistory.length = 100;
  
  logAudit("AI Studio", prompt.slice(0, 60), "успешно", result);
  saveState();
  render();
  
  // Show result modal
  openModal({
    title:"ИИ выполнил ТЗ",
    subtitle:"Результат готов",
    body:'<div class="ai-bubble"><strong>ТЗ:</strong> ' + escapeHtml(prompt) + '</div>' +
      '<div class="card-flat" style="margin-top:12px"><div class="label">Что сделано</div>' +
      '<div class="row-title" style="color:#a6f0c0;margin-top:6px">' + escapeHtml(result) + '</div></div>' +
      '<div class="note ok" style="margin-top:12px">Изменения применены немедленно. Можно посмотреть в соответствующем разделе.</div>',
    footer:'<button class="btn btn-primary" data-action="close-modal">Отлично</button>'
  });
}

function adminStats(user){
  const period = route.params.period || "30d";
  const p = PERIODS.find(x => x.key === period) || PERIODS[2];
  const since = p.days ? Date.now() - p.days * 86400000 : 0;
  const inP = iso => !since || new Date(iso).getTime() >= since;
  const ordersIn = DB.orders.filter(o => inP(o.createdAt));
  const statusCounts = ORDER_STATUSES.map(s => ({ label: s, value: ordersIn.filter(o => o.status === s).length }));
  const maxStatus = Math.max(1, ...statusCounts.map(s => s.value));
  const trend = PERIODS.filter(x => x.days).map(x => ({ label: x.label, value: DB.orders.filter(o => new Date(o.createdAt).getTime() >= Date.now() - x.days * 86400000).length }));
  const maxTrend = Math.max(1, ...trend.map(t => t.value));
  return '<div class="admin-title">Статистика</div><div class="admin-desc">Значения из данных.</div>' +
    '<div class="tabs">' + PERIODS.map(x => '<button class="tab' + (x.key === period ? " active" : "") + '" data-action="stats-period" data-period="' + x.key + '">' + escapeHtml(x.label) + '</button>').join("") + '</div>' +
    '<div class="stat-grid" style="margin-bottom:18px">' +
      statCard(DB.users.filter(u => inP(u.createdAt)).length, "Пользователей") +
      statCard(DB.users.filter(u => u.role !== "CLIENT").length, "Сотрудников") +
      statCard(ordersIn.filter(o => !FINAL_STATUSES.includes(o.status)).length, "Активных") +
      statCard(ordersIn.filter(o => o.status === "Завершён").length, "Завершённых") +
      statCard(DB.news.filter(n => inP(n.createdAt)).length, "Новостей") +
      statCard(DB.reviews.filter(r => inP(r.createdAt)).length, "Отзывов") + '</div>' +
    (ordersIn.length
      ? '<div class="card-flat" style="margin-bottom:16px"><div class="label" style="margin-bottom:6px">Заказы по статусам</div>' +
        '<div class="chart">' + statusCounts.map(s => '<div class="chart-col"><div class="chart-value">' + s.value + '</div>' +
          '<div class="chart-bar-wrap"><div class="chart-bar" style="height:' + Math.round((s.value/maxStatus)*100) + '%"></div></div>' +
          '<div class="chart-label">' + escapeHtml(s.label.slice(0,10)) + '</div></div>').join("") + '</div></div>'
      : emptyState("chart","Нет данных","За период заказов нет."));
}

function actionKind(a){
  const s = String(a).toLowerCase();
  if(s.includes("пользовател")||s.includes("user")) return "user";
  if(s.includes("заказ")||s.includes("order")) return "order";
  if(s.includes("новост")||s.includes("проект")||s.includes("отзыв")||s.includes("news")||s.includes("review")) return "content";
  if(s.includes("услуг")||s.includes("service")) return "service";
  if(s.includes("роль")||s.includes("role")||s.includes("тег")||s.includes("tag")) return "role";
  if(s.includes("поддерж")||s.includes("support")||s.includes("чат")||s.includes("chat")) return "support";
  return "system";
}

function openModal(opts){
  const root = document.getElementById("modalRoot");
  root.innerHTML = '<div class="modal-backdrop" id="modalBackdrop">' +
    '<div class="modal' + (opts.wide ? " modal-wide" : "") + '" role="dialog">' +
      '<div class="modal-head"><div><div class="modal-title">' + escapeHtml(opts.title||"") + '</div>' +
        (opts.subtitle ? '<div class="modal-sub">' + escapeHtml(opts.subtitle) + '</div>' : '') + '</div>' +
        '<button class="modal-close" data-action="close-modal">' + ic("x",16) + '</button></div>' +
      '<div class="modal-body">' + (opts.body || "") + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') + '</div></div>';
  const bd = document.getElementById("modalBackdrop");
  requestAnimationFrame(() => bd.classList.add("open"));
  modalOpenFlag = true;
  bd.addEventListener("mousedown", e => { if(e.target === bd) closeModal(); });
}
function closeModal(){
  const bd = document.getElementById("modalBackdrop");
  if(!bd) return;
  bd.classList.remove("open");
  modalOpenFlag = false;
  setTimeout(() => { document.getElementById("modalRoot").innerHTML = ""; }, 220);
}
document.addEventListener("keydown", e => { if(e.key === "Escape" && modalOpenFlag) closeModal(); });

document.addEventListener("submit", e => {
  const form = e.target.closest("form[data-form]");
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  try {
    switch(type){
      case "login": handleLogin(form); break;
      case "register": handleRegister(form); break;
      case "order": handleOrder(form); break;
      case "ticket": handleTicket(form); break;
      case "review": handleReview(form); break;
      case "edit-profile": handleEditProfile(form); break;
      case "change-password": handleChangePassword(form); break;
      case "order-message": handleOrderMessage(form); break;
      case "ticket-message": handleTicketMessage(form); break;
      case "dev-message": handleDevMessage(form); break;
      case "chat-message": handleChatMessage(form); break;
      case "new-chat": handleNewChat(form); break;
      case "admin-user": handleAdminUser(form); break;
      case "team-assign": handleTeamAssign(form); break;
      case "invite": handleInvite(form); break;
      case "edit-role": handleEditRole(form); break;
      case "tag": handleTag(form); break;
      case "service": handleService(form); break;
      case "feature": handleFeature(form); break;
      case "news": handleNews(form); break;
      case "project": handleProject(form); break;
      case "partner": handlePartner(form); break;
      case "texts": handleTexts(form); break;
      case "settings": handleSettings(form); break;
      case "add-developer": handleAddDeveloper(form); break;
      case "apply-admin": handleApplyAdmin(form); break;
      case "verify": handleVerify(form); break;
      case "user-texts": handleUserTexts(form); break;
      case "forgot": handleForgot(form); break;
      case "activate-bonus": handleActivateBonus(form); break;
      case "bonus": handleBonusCreate(form); break;
      case "ai-studio": handleAIStudio(form); break;
      default: toast("Неизвестная форма","err");
    }
  } catch(err){ console.error(err); toast("Ошибка: " + err.message, "err"); }
});

function showError(id, msg){
  const el = document.getElementById(id);
  if(!el){ toast(msg,"err"); return; }
  el.textContent = msg; el.classList.add("show");
}
function hideError(id){
  const el = document.getElementById(id);
  if(el){ el.textContent = ""; el.classList.remove("show"); }
}
function applyTheme(){ document.documentElement.setAttribute("data-theme", DB.settings.theme || "dark"); }
function transliterate(str){
  const m = {"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"zh","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"h","ц":"ts","ч":"ch","ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"","э":"e","ю":"yu","я":"ya"};
  return String(str).toLowerCase().split("").map(c => m[c] !== undefined ? m[c] : c).join("");
}

function handleLogin(form){
  hideError("loginError");
  const username = String(form.username.value || "").trim().replace(/^@/,"");
  const password = String(form.password.value || "");
  if(!username || !password){ showError("loginError","Заполните поля"); return; }
  const user = findUserByUsername(username);
  if(!user) return showError("loginError","Пользователь не найден");
  if(user.passwordHash !== hashPassword(password)) return showError("loginError","Неверный пароль");
  DB.session = { userId: user.id, at: nowISO() };
  logAudit("Вход", "@" + user.username, "успешно");
  saveState();
  toast("Добро пожаловать, " + user.name + "!", "ok");
  navigate("home");
}
function handleRegister(form){
  hideError("regError");
  const name = String(form.name.value || "").trim();
  const username = String(form.username.value || "").trim().replace(/^@/,"");
  const password = String(form.password.value || "");
  const password2 = String(form.password2.value || "");
  const min = DB.settings.passwordMinLength || 4;
  if(name.length < 2) return showError("regError","Имя слишком короткое");
  if(!/^[a-zA-Z0-9_]{3,24}$/.test(username)) return showError("regError","Username некорректен");
  if(findUserByUsername(username)) return showError("regError","Username занят");
  if(password.length < min) return showError("regError","Пароль минимум " + min);
  if(password !== password2) return showError("regError","Пароли не совпадают");
  if(!DB.settings.allowRegistration) return showError("regError","Регистрация закрыта");
  const newUser = { id: uid("usr"), name, username, passwordHash: hashPassword(password),
    role: "CLIENT", tags: ["tag_client"], specializations: [], bio: "", status: "active",
    accountStatus: "active", verification: null, permissionOverride: null,
    customTexts: {}, balance: 0, dynamicPlaceholders: {}, createdAt: nowISO() };
  DB.users.push(newUser);
  DB.session = { userId: newUser.id, at: nowISO() };
  logAudit("Регистрация", "@" + username, "успешно");
  notifyStaff("users.view", "user", "Новый пользователь @" + username, newUser.id);
  saveState();
  toast("Аккаунт создан", "ok");
  navigate("home");
}
function handleForgot(form){
  hideError("fgError");
  const username = String(form.username.value || "").trim();
  const user = findUserByUsername(username);
  if(!user) return showError("fgError","Не найден");
  DB.resetRequests.push({ id: uid("rst"), username, at: nowISO() });

}
function handleChangePassword(form){
  hideError("cpError");
  const user = currentUser();
  if(!user) return;
  const oldP = String(form.oldPassword.value || "");
  const newP = String(form.newPassword.value || "");
  const newP2 = String(form.newPassword2.value || "");
  const min = DB.settings.passwordMinLength || 4;
  if(user.passwordHash !== hashPassword(oldP)) return showError("cpError","Неверный пароль");
  if(newP.length < min) return showError("cpError","Слишком короткий");
  if(newP !== newP2) return showError("cpError","Не совпадают");
  user.passwordHash = hashPassword(newP);
  logAudit("Смена пароля", "@" + user.username, "успешно");
  saveState(); closeModal(); toast("Пароль изменён", "ok");
}

function handleOrder(form){
  hideError("orderError");
  const user = currentUser();
  if(!user) return;
  const service = DB.services.find(s => s.id === String(form.serviceId.value || ""));
  const title = String(form.title.value || "").trim();
  const description = String(form.description.value || "").trim();
  const price = Number(form.price.value);
  const deadlineRaw = String(form.deadline.value || "");
  const contact = String(form.contact.value || "").trim();
  if(!service) return showError("orderError","Выберите услугу");
  if(title.length < 3) return showError("orderError","Название короткое");
  if(description.length < 10) return showError("orderError","Описание короткое");
  if(!Number.isFinite(price) || price <= 0) return showError("orderError","Цена некорректна");
  if(!contact) return showError("orderError","Укажите контакт");
  const deadline = deadlineRaw ? parseDateInputLocal(deadlineRaw) : null;
  const number = "M2-" + String(Date.now()).slice(-6);
  const order = { id: uid("ord"), number, clientId: user.id, serviceId: service.id,
    category: service.category, title, description, price, deadline, contact,
    assigneeId: "system", status: "Новый", chatBlocked: false, createdAt: nowISO(),
    history: [{ at: nowISO(), by: user.name, text: "Заказ создан" }], messages: [] };
  DB.orders.unshift(order);
  const chat = { id: uid("cht"), participants: [user.id, "system"], orderId: order.id, messages: [], createdAt: nowISO(), lastAt: nowISO() };
  chat.messages.push({ id: uid("msg"), authorId: "system", authorName: "Система",
    text: "Заказ " + number + " создан. Ожидает назначения администратора.", at: nowISO(), read: false });
  DB.chats.push(chat);
  pushNotification(user.id, "order", "Заказ " + number + " создан.");
  notifyStaff("orders.view_all", "order", "Новый заказ " + number + " от @" + user.username, user.id);
  logAudit("Создание заказа", number, "успешно");
  saveState(); closeModal(); toast("Заказ " + number + " создан", "ok"); navigate("orders");
}
function handleOrderMessage(form){
  const user = currentUser();
  if(!user) return;
  const order = DB.orders.find(o => o.id === form.dataset.id);
  if(!order || order.chatBlocked || FINAL_STATUSES.includes(order.status)) return toast("Чат недоступен","warn");
  const text = String(form.text.value || "").trim();
  if(!text) return;
  order.messages.push({ id: uid("msg"), authorId: user.id, authorName: user.name, text, at: nowISO() });
  const chat = DB.chats.find(c => c.orderId === order.id);
  if(chat){ chat.messages.push({ id: uid("msg"), authorId: user.id, authorName: user.name, text, at: nowISO(), read: false }); chat.lastAt = nowISO(); }
  if(order.clientId !== user.id) pushNotification(order.clientId, "order", "Ответ по заказу " + order.number);
  if(order.assigneeId && order.assigneeId !== user.id && order.assigneeId !== "system") pushNotification(order.assigneeId, "order", "Сообщение по заказу " + order.number);
  saveState(); openOrderDetail(order.id); toast("Отправлено","ok");
}

function handleDevMessage(form){
  hideError("devMsgError");
  const user = currentUser();
  const dev = DB.users.find(u => u.id === form.dataset.id);
  if(!user || !dev) return;
  const text = String(form.text.value || "").trim();
  if(text.length < 3) return showError("devMsgError","Короткое");
  let chat = DB.chats.find(c => c.participants.length === 2 && c.participants.indexOf(user.id) !== -1 && c.participants.indexOf(dev.id) !== -1);

  pushNotification(dev.id, "message", "Сообщение от @" + user.username);
  saveState(); closeModal(); navigate("chat", { chatId: chat.id }); toast("Отправлено","ok");

function handleChatMessage(form){
  const user = currentUser();
  if(!user) return;
  const chat = DB.chats.find(c => c.id === form.dataset.id);
  if(!chat) return;
  const text = String(form.text.value || "").trim();
  if(!text) return;
  chat.messages.push({ id: uid("msg"), authorId: user.id, authorName: user.name, text, at: nowISO(), read: false });
  chat.lastAt = nowISO();
  const otherId = chat.participants.find(p => p !== user.id);
  if(otherId) pushNotification(otherId, "message", "Сообщение от @" + user.username);
  if(chat.orderId){
    const order = DB.orders.find(o => o.id === chat.orderId);
    if(order){ order.messages = order.messages || []; order.messages.push({ id: uid("msg"), authorId: user.id, authorName: user.name, text, at: nowISO() }); }
  }
  saveState();
  // Refresh chat inline
  const box = document.getElementById("chatMessages");
  if(box){
    box.innerHTML = chat.messages.map(m => {
      const mine = m.authorId === user.id;
      return '<div class="chat-msg ' + (mine ? "mine" : "other") + '">' +
        (!mine ? '<div class="chat-msg-author">' + escapeHtml(m.authorName) + '</div>' : '') +
        '<div>' + escapeHtml(m.text) + '</div>' +
        '<div class="chat-msg-time">' + new Date(m.at).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) + '</div></div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
    const inp = document.querySelector('form[data-form="chat-message"] input[name="text"]');
    if(inp) inp.value = "";
  }
}

function handleAdminUser(form){
  hideError("auError");
  const actor = currentUser();
  const u = DB.users.find(x => x.id === form.dataset.id);
  if(!u) return;
  if(hasPerm(actor,"users.roles") && u.role !== "OWNER"){
    const newRole = String(form.role.value || u.role);
    if(newRole !== u.role && ROLE_LABELS[newRole]) u.role = newRole;
  }
  if(hasPerm(actor,"users.tags")) u.tags = Array.from(form.querySelectorAll('input[name="tags"]:checked')).map(i => i.value);
  if(canManageSpecs(actor)) u.specializations = Array.from(form.querySelectorAll('input[name="spec"]:checked')).map(i => i.value);
  if(hasPerm(actor,"users.permissions")){
    const useRole = form.useRolePerms ? form.useRolePerms.checked : true;
    u.permissionOverride = useRole ? null : Array.from(form.querySelectorAll('input[name="perms"]:checked')).map(i => i.value);
  }
  if(hasPerm(actor,"users.balance") && form.balance){
    const b = Number(form.balance.value);
    if(Number.isFinite(b) && b >= 0) u.balance = b;
  }
  if(hasPerm(actor,"users.suspend") && form.status) u.status = String(form.status.value);
  if(hasPerm(actor,"users.status") && form.accountStatus) u.accountStatus = String(form.accountStatus.value);
  if(hasPerm(actor,"users.verify") && form.verified){
    if(form.verified.checked){
      const txt = String(form.verifyText.value || "").trim() || "Аккаунт подтверждён студией M²";
      u.verification = { text: txt, grantedAt: nowISO() };
    } else u.verification = null;
  }
  logAudit("Изменение пользователя", "@" + u.username, "успешно");
  saveState(); closeModal(); toast("Сохранено","ok"); render();
}
function handleTeamAssign(form){
  const actor = currentUser();
  const userId = form.userId ? String(form.userId.value || "") : "";
  if(!userId) return;
  const u = DB.users.find(x => x.id === userId);
  if(!u) return;
  const newRole = String(form.role.value || "CLIENT");
  if(newRole === "OWNER") return;

function handleActivateBonus(form){
  hideError("bonusError");
  const user = currentUser();
  if(!user) return;
  const code = String(form.code.value || "").trim().toUpperCase();
  if(!code) return showError("bonusError","Введите промокод");
  const bonus = DB.bonuses.find(b => b.code.toUpperCase() === code && b.status === "active");
  if(!bonus) return showError("bonusError","Промокод не найден или неактивен");
  if(bonus.usedBy.indexOf(user.id) !== -1) return showError("bonusError","Вы уже активировали этот бонус");
  if(bonus.usedBy.length >= bonus.maxUses) return showError("bonusError","Бонус исчерпан");
  // Apply
  if(bonus.type === "stars") user.balance = (user.balance || 0) + bonus.value;
  bonus.usedBy.push(user.id);
  DB.userBonuses.push({ id: uid("ub"), userId: user.id, bonusId: bonus.id, status: "active", appliedAt: nowISO() });
  pushNotification(user.id, "bonus", "Бонус «" + bonus.title + "» активирован");
  logAudit("Активация бонуса", code, "успешно", user.username);
  saveState(); closeModal(); toast("Бонус активирован! +" + (bonus.type === "stars" ? bonus.value + " ⭐" : bonus.value + "% скидка"), "ok"); render();
}
